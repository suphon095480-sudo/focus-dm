name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project
        run: flutter create --org com.focusdm --project-name focus_dm --platforms=android app

      - name: Add app code and WebView package
        run: |
          cp lib/main.dart app/lib/main.dart
          cd app
          flutter pub add webview_flutter

      - name: Allow internet access
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' app/android/app/src/main/AndroidManifest.xml
          grep -n "INTERNET" app/android/app/src/main/AndroidManifest.xml

      - name: Build APK
        run: |
          cd app
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../focus_dm.apk

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: FocusDM build ${{ github.run_number }}
          files: focus_dm.apk
